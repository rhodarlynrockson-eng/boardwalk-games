<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

    <title>Boardwalk Games</title>
    
</head>
<!-- Classes on body help keep the footer at the bottom of the page -->
<body class="d-flex flex-column min-vh-100">

    <!-- Header with carousel -->
    <header class="container">
        <div class="row">
            <div class="col-12 col-xl-6">
                <h1>Welcome to Boardwalk Games</h1>
                <p>
                    Discover exciting board games, events, and activities
                    for everyone to enjoy.
                </p>
            </div>
            <div class="col-12 col-xl-6">Carousel</div>
        </div>
    </header>

    <!-- Main content: not part of the Bootstrap grid itself -->
    <main>
        <!-- Services section -->
        <section class="container">
            <div class="row">
                <div class="col-12">Services section heading</div>
                <div class="col-12 col-md-6 col-xl-3">Services card</div>
                <div class="col-12 col-md-6 col-xl-3">Services card</div>
                <div class="col-12 col-md-6 col-xl-3">Services card</div>
                <div class="col-12 col-md-6 col-xl-3">Services card</div>
            </div>
        </section>
    </main>

    <!-- Footer / contact section -->
    <footer class="mt-auto">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">Contact section heading</div>
                <div class="col-12 col-md-6 col-xl-4">
                    Contact info &amp; social links
                </div>
                <div class="col-12 col-md-6 col-xl-4">Opening times</div>
            </div>
        </div>
    </footer>


   <!--Font awesome kit-->
   <script src="https://kit.fontawesome.com/0d10eb3525.js" crossorigin="anonymous"></script> 
<!-- Bootstrap JavaScript Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
</body>
</html>
